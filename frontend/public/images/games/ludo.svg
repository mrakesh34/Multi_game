<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <radialGradient id="ludoBg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#222733"/>
      <stop offset="100%" stop-color="#111318"/>
    </radialGradient>
    <linearGradient id="dieFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#ddd3c2"/>
    </linearGradient>
    <filter id="ludoDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.58"/>
    </filter>
  </defs>

  <rect width="320" height="200" fill="url(#ludoBg)"/>

  <!-- Compact 15x15 Tactile Ludo Board Isometric-Style Tile -->
  <g transform="translate(56, 22)" filter="url(#ludoDrop)">
    <rect x="0" y="0" width="156" height="156" rx="16" fill="#181c24" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
    <!-- Inner Board -->
    <g transform="translate(10, 10)">
      <rect x="0" y="0" width="136" height="136" rx="8" fill="#101319" stroke="#2d3444" stroke-width="1"/>
      <!-- 4 Colored Yards -->
      <rect x="2" y="2" width="52" height="52" rx="6" fill="#d9482b"/>
      <rect x="10" y="10" width="36" height="36" rx="5" fill="#f5efe6"/>
      <circle cx="20" cy="20" r="4.5" fill="#d9482b"/><circle cx="36" cy="20" r="4.5" fill="#d9482b"/>
      <circle cx="20" cy="36" r="4.5" fill="#d9482b"/><circle cx="36" cy="36" r="4.5" fill="#d9482b"/>

      <rect x="82" y="2" width="52" height="52" rx="6" fill="#059669"/>
      <rect x="90" y="10" width="36" height="36" rx="5" fill="#f5efe6"/>
      <circle cx="100" cy="20" r="4.5" fill="#059669"/><circle cx="116" cy="20" r="4.5" fill="#059669"/>
      <circle cx="100" cy="36" r="4.5" fill="#059669"/><circle cx="116" cy="36" r="4.5" fill="#059669"/>

      <rect x="82" y="82" width="52" height="52" rx="6" fill="#d97706"/>
      <rect x="90" y="90" width="36" height="36" rx="5" fill="#f5efe6"/>
      <circle cx="100" cy="100" r="4.5" fill="#d97706"/><circle cx="116" cy="100" r="4.5" fill="#d97706"/>
      <circle cx="100" cy="116" r="4.5" fill="#d97706"/><circle cx="116" cy="116" r="4.5" fill="#d97706"/>

      <rect x="2" y="82" width="52" height="52" rx="6" fill="#3b6e8c"/>
      <rect x="10" y="90" width="36" height="36" rx="5" fill="#f5efe6"/>
      <circle cx="20" cy="100" r="4.5" fill="#3b6e8c"/><circle cx="36" cy="100" r="4.5" fill="#3b6e8c"/>
      <circle cx="20" cy="116" r="4.5" fill="#3b6e8c"/><circle cx="36" cy="116" r="4.5" fill="#3b6e8c"/>

      <!-- Home Lanes -->
      <rect x="10" y="63" width="44" height="10" rx="2" fill="#d9482b" fill-opacity="0.85"/>
      <rect x="63" y="10" width="10" height="44" rx="2" fill="#059669" fill-opacity="0.85"/>
      <rect x="82" y="63" width="44" height="10" rx="2" fill="#d97706" fill-opacity="0.85"/>
      <rect x="63" y="82" width="10" height="44" rx="2" fill="#3b6e8c" fill-opacity="0.85"/>

      <!-- Center Home Triangles -->
      <polygon points="56,56 80,56 68,68" fill="#059669"/>
      <polygon points="80,56 80,80 68,68" fill="#d97706"/>
      <polygon points="80,80 56,80 68,68" fill="#3b6e8c"/>
      <polygon points="56,80 56,56 68,68" fill="#d9482b"/>
    </g>
  </g>

  <!-- Tactile Ivory Die & Sculpted Pawns -->
  <g transform="translate(226, 48) rotate(12)" filter="url(#ludoDrop)">
    <rect x="0" y="0" width="52" height="52" rx="11" fill="url(#dieFace)" stroke="#ffffff" stroke-width="1"/>
    <circle cx="14" cy="14" r="4.2" fill="#171a21"/>
    <circle cx="38" cy="14" r="4.2" fill="#171a21"/>
    <circle cx="26" cy="26" r="4.6" fill="#d9482b"/>
    <circle cx="14" cy="38" r="4.2" fill="#171a21"/>
    <circle cx="38" cy="38" r="4.2" fill="#171a21"/>
  </g>

  <!-- Two Sculpted Pawns -->
  <g filter="url(#ludoDrop)">
    <g transform="translate(216, 122)">
      <ellipse cx="14" cy="36" rx="12" ry="4.5" fill="#0b0d11" fill-opacity="0.6"/>
      <path d="M5 34 L10 15 L18 15 L23 34 Z" fill="#d9482b" stroke="#fff5f2" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="14" cy="11" r="7.5" fill="#e85c3f" stroke="#fff5f2" stroke-opacity="0.65" stroke-width="1"/>
    </g>
    <g transform="translate(250, 126)">
      <ellipse cx="13" cy="34" rx="11" ry="4" fill="#0b0d11" fill-opacity="0.6"/>
      <path d="M5 32 L9.5 14 L16.5 14 L21 32 Z" fill="#059669" stroke="#ecfdf5" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="13" cy="10" r="7" fill="#10b981" stroke="#ecfdf5" stroke-opacity="0.65" stroke-width="1"/>
    </g>
  </g>
</svg>
